<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; }
  #frame { width:100%; border:0; display:block; height:200px; overflow:hidden; }
</style>
</head>
<body>
  <iframe id="frame"
    src="https://script.google.com/macros/s/AKfycbx06B5POhaw26VYMiCSzloTiX8goe-ysaokKbJAe0fWIgiYW0zekI9UcxNsxd-vEVrNvw/exec?page=public"
    scrolling="no"
    allow="autoplay; fullscreen"
    referrerpolicy="no-referrer">
  </iframe>

  <script>
    window.addEventListener("message", e => {
      if (e.data && e.data.type === "news-height") {
        document.getElementById("frame").style.height = (e.data.height + 4) + "px";
      }
    });
  </script>
</body>
</html>
