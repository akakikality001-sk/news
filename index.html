<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .wrap {
    padding: 14px;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #fdf2f8 0%, #eef2ff 100%);
    border-radius: 14px;
    transform-origin: top left;
  }
  .post {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(102,126,234,0.12);
    border-left: 5px solid transparent;
    border-image: linear-gradient(180deg,#667eea,#f5576c) 1;
  }
  .heading {
    font-size: 18px;
    font-weight: 800;
    margin: 0 0 6px;
    line-height: 1.25;
    background: linear-gradient(90deg,#667eea,#f5576c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .meta {
    font-size: 11px;
    color: #9ca3af;
    margin-bottom: 8px;
  }
  .text {
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 10px;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: #374151;
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }
  .gallery .item {
    border-radius: 10px;
    overflow: hidden;
    background: #f3f4f6;
    box-shadow: 0 3px 10px rgba(102,126,234,0.18);
    aspect-ratio: 1;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .gallery .item:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(102,126,234,0.35);
  }
  .gallery img, .gallery video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .empty, .loading {
    color: #6b7280; font-size: 13px; text-align: center; padding: 24px 0;
  }
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.9);
    display: none; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img, .lightbox video { max-width: 95vw; max-height: 95vh; border-radius: 12px; }
  .lightbox .close {
    position: absolute; top: 16px; right: 20px;
    background: #fff; color: #111; border: 0; border-radius: 50%;
    width: 36px; height: 36px; font-size: 20px; cursor: pointer; line-height: 34px; padding: 0;
  }
 /* Mobile-first base */
.heading { font-size: 20px; }
.text    { font-size: 15px; }

@media (max-width: 480px) {
  .wrap    { padding: 12px; }
  .heading { font-size: 22px; }  /* larger on phones */
  .text    { font-size: 16px; line-height: 1.6; }
  .meta    { font-size: 12px; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
}
</style>
</head>
<body>
  <div class="wrap" id="wrap"><div class="loading">Loading…</div></div>
  <div class="lightbox" id="lightbox"></div>

<script>
  const API = "https://script.google.com/macros/s/AKfycbyqsz1HYdn68GcCstUkHWg6J63zsx9qPpW6al9YpfZM74pe62SMn8PxCsp6O0SW7ZdDDA/exec";

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function dataUrlFor(mime, b64) {
    return `data:${mime || "application/octet-stream"};base64,${b64}`;
  }
  function fmtDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" })
           + " · " + d.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit" });
    } catch (e) { return ""; }
  }

  function renderPosts(posts) {
    const wrap = document.getElementById("wrap");

    if (!Array.isArray(posts) || !posts.length) {
      wrap.innerHTML = '<div class="empty">No news yet.</div>';
      fitToParent();
      return;
    }

    wrap.innerHTML = posts.map(p => {
      const heading = p.heading ? `<div class="heading">${escapeHtml(p.heading)}</div>` : "";
      const date = p.created ? `<div class="meta">${fmtDate(p.created)}</div>` : "";
      const text = p.text ? `<div class="text">${escapeHtml(p.text)}</div>` : "";
      const gallery = (p.media && p.media.length)
        ? `<div class="gallery" data-post="${p.id}"></div>` : "";
      return `<div class="post">${heading}${date}${text}${gallery}</div>`;
    }).join("");

    // Load each post's media asynchronously
    let pending = 0;
    posts.forEach(p => {
      if (!p.media || !p.media.length) return;
      const gallery = wrap.querySelector(`.gallery[data-post="${p.id}"]`);
      p.media.forEach(m => {
        pending++;
        fetch(API + "?action=media&id=" + encodeURIComponent(m.id))
          .then(r => r.text())
          .then(b64 => {
            const url = dataUrlFor(m.mime, b64);
            const item = document.createElement("div");
            item.className = "item";
            if (m.type === "image") {
              item.innerHTML = `<img src="${url}" alt="${escapeHtml(m.name||"")}" loading="lazy">`;
            } else if (m.type === "video") {
              item.innerHTML = `<video src="${url}" muted playsinline preload="metadata"></video>`;
            } else {
              item.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:#6b7280;padding:8px;text-align:center">${escapeHtml(m.name||"file")}</div>`;
            }
            item.onclick = () => openLightbox(url, m.type);
            gallery.appendChild(item);
          })
          .catch(() => {})
          .finally(() => {
            pending--;
            if (pending === 0) fitToParent();
          });
      });
    });

    // Allow initial height even before media loads
    setTimeout(fitToParent, 50);
    fitToParent();
  }

  function openLightbox(url, type) {
    const lb = document.getElementById("lightbox");
    lb.innerHTML = '<button class="close">×</button>';
    const el = document.createElement(type === "video" ? "video" : "img");
    el.src = url;
    if (type === "video") { el.controls = true; el.autoplay = true; }
    lb.appendChild(el);
    lb.classList.add("open");
    lb.querySelector(".close").onclick = () => lb.classList.remove("open");
    lb.onclick = e => { if (e.target === lb) lb.classList.remove("open"); };
  }

  function fitToParent() {
  const wrap = document.getElementById("wrap");
  wrap.style.transform = "";
  wrap.style.width = "";

  const parentH = window.innerHeight;
  const contentH = wrap.scrollHeight;
  if (!contentH || !parentH) return;

  // Only shrink if needed, and never below 75%
  let scale = parentH / contentH;
  if (scale > 1) scale = 1;       // don't enlarge
  if (scale < 0.75) scale = 0.75; // don't shrink too far

  if (scale < 1) {
    wrap.style.transformOrigin = "top left";
    wrap.style.transform = `scale(${scale})`;
    wrap.style.width = (100 / scale) + "%";
  }

  try {
    parent.postMessage({ type: "news-height", height: Math.ceil(document.body.scrollHeight) }, "*");
  } catch(e){}
}

  window.addEventListener("resize", fitToParent);

  fetch(API + "?action=get")
    .then(r => r.json())
    .then(renderPosts)
    .catch(() => {
      document.getElementById("wrap").innerHTML = '<div class="empty">Unable to load news.</div>';
      fitToParent();
    });
</script>
</body>
</html>
