<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    height: 100%;
    overflow: hidden;
  }
  #frame {
    width: 100%;
    border: 0;
    display: block;
    height: 900px;            /* initial; will be overridden */
    min-height: 500px;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: transparent;
  }
</style>
</head>
<body>
  <iframe
    id="frame"
    src="https://script.google.com/macros/s/AKfycbyqsz1HYdn68GcCstUkHWg6J63zsx9qPpW6al9YpfZM74pe62SMn8PxCsp6O0SW7ZdDDA/exec"
    scrolling="yes"
    allow="autoplay; fullscreen"
    referrerpolicy="no-referrer">
  </iframe>

  <script>
    window.addEventListener("message", function (e) {
      if (e.data && e.data.type === "news-height") {
        var f = document.getElementById("frame");
        var newHeight = Math.max(500, e.data.height + 4);
        f.style.height = newHeight + "px";
      }
    });
  </script>
</body>
</html>
